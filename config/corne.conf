# ============================================================
# Corne 42 LP Wireless — nice!nano v2
# ============================================================

# --- Bluetooth ---
# Allow host to negotiate 7.5–15 ms connection interval
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Power / Sleep ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_EXT_POWER=y

# --- Debounce ---
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# --- Kconfig compat ---
# Suppress Zephyr 4.1 KSCAN deprecation warning (ZMK kscan still uses it internally)
CONFIG_WARN_DEPRECATED=n

# --- Display (OLED) ---
# The nice_oled module provides the custom screen; we just enable display here.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

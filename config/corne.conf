e Enable ZMK Studio support
CONFIG_ZMK_STUDIO=y

# Increase Bluetooth signal strength
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep (15 min idle)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Enable eager debounce for responsiveness
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Display (OLED) - using nice_oled module
CONFIG_ZMK_DISPLAY=y

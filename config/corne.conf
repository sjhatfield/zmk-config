CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=n
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_DISPLAY=n
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y  # disabled for latency diagnostic
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Disable per-keypress WPM hook (biggest nice_oled latency source)
CONFIG_NICE_OLED_WIDGET_WPM=n
# Disable HID indicators (Caps/Num Lock not needed)
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
